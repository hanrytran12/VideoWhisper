# Pipeline config — tinh chỉnh cho RTX 3050 Laptop 4GB VRAM

output_root: output

transcribe:
  model: medium          # small | medium | large-v3-turbo
  device: cuda           # cuda | cpu
  compute_type: int8     # int8 tiết kiệm VRAM; float16 nếu đủ chỗ
  language: ja           # vi | ja | en | null (auto-detect)
  batch_size: 8
  vad_filter: false      # VAD đôi khi cắt nhầm toàn bộ audio → tắt mặc định
  align: true            # word-level timestamps

separate:
  model: htdemucs        # demucs model; chạy CPU, tách 2-stem (vocals/no_vocals)

asd:
  sample_fps: 5          # số frame/giây lấy mẫu để detect mặt
  max_faces: 4           # số mặt tối đa mediapipe theo dõi
  iou_thresh: 0.3        # ngưỡng IoU để gán detection vào track sẵn có
  active_std_thresh: 0.012  # std độ mở môi (chuẩn hoá theo chiều cao mặt) → đang nói
  window: 5              # số frame mỗi bên để tính variance

av_match:
  min_score: 0.3         # tỉ lệ sample active tối thiểu để gán face cho segment

frames:
  jpeg_quality: 90
  # frame đại diện lấy ở giữa segment

vlm:
  ollama_host: http://127.0.0.1:11434
  model: minicpm-v       # tag thực tế kiểm tra lúc setup; fallback llava
  prompt: |
    Mô tả ngắn gọn bối cảnh hình ảnh trong khung hình này bằng tiếng Việt:
    nhân vật (giới tính, độ tuổi ước lượng, trang phục, biểu cảm), bối cảnh,
    và không khí chung. Nếu không có người, mô tả cảnh vật.
  timeout: 120
  num_gpu: 20            # số layer offload lên GPU (giảm nếu OOM)

# Bật/tắt từng stage
stages:
  separate: false        # bật để transcribe trên vocals đã tách (chậm, CPU)
  transcribe: true
  asd: true
  av_match: true
  offscreen: true
  frames: true
  vlm_context: true
  assemble: true
